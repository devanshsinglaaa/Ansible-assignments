name: CI/CD assignment 3 dynamic inventories.
on:
  push:
    branches: [final_fix]

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Install amazon.aws using ansible-galaxy collection.
        run: |
          ansible-galaxy collection install amazon.aws

      - name: Install AWS SDK
        run: |
          sudo apt update
          sudo apt install python3-boto3 python3-botocore -y

      - name: Install unzip
        run: |
          sudo apt-get install unzip -y


      - name: Check AWS CLI / Install AWS CLI.
        run: |
          if aws --version; then
            echo "AWS CLI is already installed"
          else
            echo "AWS CLI is not installed"
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip awscliv2.zip
            sudo ./aws/install
          fi

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/test-node-1-key.pem
          chmod 600 ~/.ssh/test-node-1-key.pem

  test:
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - name: Test dynamic inventory
        run: |
          ansible-inventory -i aws_ec2.yaml --graph
