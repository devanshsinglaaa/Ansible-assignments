name: CI/CD assignment 3 dynamic inventories.
on:
  push:
    branches: [final_fix]
  workflow_dispatch:

jobs:
  set-up-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install amazon.aws using ansible-galaxy collection.
        run: |
          ansible-galaxy collection install amazon.aws

      - name: Install AWS SDK
        run: |
          sudo apt update
          sudo apt install python3-boto3 python3-botocore -y

      - name: Install unzip
        run: |
          sudo apt-get install unzip -y


      - name: Check AWS CLI / Install AWS CLI.
        run: |
          if aws --version; then
            echo "AWS CLI is already installed"
          else
            echo "AWS CLI is not installed"
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip awscliv2.zip
            sudo ./aws/install
          fi

      - name: Configure AWS credentials
        run: |
          aws configure set aws_access_key_id "${{ secrets.AWS_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws configure set region us-west-2

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/test-node-1-key.pem
          chmod 600 ~/.ssh/test-node-1-key.pem

  # test:
